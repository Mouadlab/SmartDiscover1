services:
  - type: web
    name: smartdiscover
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class=gthread --threads=4 --workers=2 --timeout=120 app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # à renseigner manuellement dans le dashboard Render
